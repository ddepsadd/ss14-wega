- type: entity
  parent: BaseAction
  id: ActionMansusGrasp
  name: "[color=#9b59b6]Mansus Grasp[/color]"
  description: "Призови Хватку Мансуса в руку, затем коснись жертвы."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Heretic/abilities_heretic.rsi
    layers:
    - state: mansus_grasp
  - type: Action
    useDelay: 0.5
  - type: InstantAction
    event: !type:HereticMansusGraspEvent

- type: entity
  parent: BaseAction
  id: ActionHereticOpenStore
  name: "[color=#9b59b6]Mansus Codex[/color]"
  description: "Открой кодекс знаний."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Heretic/abilities_heretic.rsi
    layers:
    - state: open_store
  - type: Action
    useDelay: 0.5
  - type: InstantAction
    event: !type:HereticOpenStoreEvent

- type: entity
  parent: BaseAction
  id: ActionHereticAshFlames
  name: "[color=#9b59b6]Огненное кольцо[/color]"
  description: "Поджигает всё вокруг."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Heretic/abilities_heretic.rsi
    layers:
    - state: volcano_blast
  - type: Action
    useDelay: 20
  - type: InstantAction
    event: !type:HereticAshExplosionEvent

- type: entity
  parent: BaseToggleAction
  id: ActionHereticAshFury
  name: "[color=#9b59b6]Ярость пепла[/color]"
  description: "Воспламенись. Скорость и ярость атак в обмен на пламя."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Heretic/abilities_heretic.rsi
    layers:
    - state: ashen_rage0
      map: ["enum.ActionVisuals.Icon"]
    - state: ashen_rage1
      map: ["enum.ActionVisuals.IconToggled"]
  - type: Action
    useDelay: 1

- type: entity
  parent: BaseToggleAction
  id: ActionHereticAshMantle
  name: "[color=#9b59b6]Мантия пепла[/color]"
  description: "Ускорься, преломляя свет пеплом."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Heretic/abilities_heretic.rsi
    layers:
    - state: shadowcloak
      map: ["enum.ActionVisuals.Icon"]
    - state: shadowcloak
      map: ["enum.ActionVisuals.IconToggled"]
  - type: Action
    useDelay: 1

- type: entity
  parent: BaseToggleAction
  id: ActionHereticAshMask
  name: "[color=#9b59b6]Маска пепла[/color]"
  description: "Источая газ, беги и заставь убегать."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Heretic/abilities_heretic.rsi
    layers:
    - state: shadowcloak
      map: ["enum.ActionVisuals.Icon"]
    - state: shadowcloak
      map: ["enum.ActionVisuals.IconToggled"]
  - type: Action
    useDelay: 1

- type: entity
  parent: BaseAction
  id: ActionHereticAshShift
  name: "[color=#9b59b6]Пепельный сдвиг[/color]"
  description: "Обратись в пепел и пламя, пройди сквозь стены."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Heretic/abilities_heretic.rsi
    layers:
    - state: ashen_shift
  - type: Action
    useDelay: 20
  - type: InstantAction
    event: !type:HereticAshShiftEvent
