- type: entity
  id: MansusGrasp
  name: mansus grasp
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Wega/Heretic/mansus_grasp.rsi
    state: icon
  - type: Item
  - type: MansusGrasp
    knockdownTime: 3
    damage:
      types:
        Heat: 10
    invocations:
    - "Ave Mansus, da mihi vires!"
    - "Aperi portam, tenebrae veniunt!"
    - "Sanguis et cinis, audite me!"

- type: entity
  parent: BaseItem
  id: HereticAshBlade
  name: ashen blade
  description: A blade of compressed ash and eldritch heat.
  components:
  - type: MeleeWeapon
    wideAnimationRotation: 45
    swingBeverage: false
    swingLeft: true
    attackRate: 1.5
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sprite
    sprite: _Wega/Heretic/Blades/ashen_blade.rsi
    state: icon
  - type: Item
    size: Normal
